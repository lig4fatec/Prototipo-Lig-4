<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18301D">
    <title>Perfil | LIG-4 Online</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/screens/t10-perfil.css">
    <script type="module" src="../js/global-nav.js"></script>
    <script type="module" src="../js/profile-page.js"></script>
  </head>
  <body class="profile-screen">
    <aside class="app-sidebar app-sidebar--global" aria-label="Navegação principal">
      <a class="app-sidebar__brand" href="./t04-home.html" aria-label="LIG-4 Online, início">
        <img class="app-sidebar__logo" src="../assets/images/logo/lig4-mark.svg" alt="">
        <span class="app-sidebar__wordmark">LIG-4</span>
      </a>
      <nav class="app-sidebar__nav" aria-label="Seções principais">
        <a class="app-sidebar__link" href="./t04-home.html">Home</a>
        <a class="app-sidebar__link" href="./t05-jogar.html">Jogar</a>
        <a class="app-sidebar__link" href="./t11-loja.html">Loja</a>
        <a class="app-sidebar__link" href="./t12-historico.html">Histórico</a>
        <a class="app-sidebar__link" href="./t10-perfil.html" aria-current="page">Perfil</a>
      </nav>
      <div class="app-sidebar__footer">
        <button class="app-sidebar__link" type="button" data-global-logout>Sair</button>
      </div>
    </aside>

    <main class="profile-main">
      <header class="screen-heading">
        <h1>Perfil</h1>
      </header>

      <nav class="ui-tab-list profile-view-tabs" role="tablist" aria-label="Visualização do perfil">
        <button class="ui-tab" id="profile-tab-data" type="button" role="tab" aria-selected="true" aria-controls="profile-panel-data" tabindex="0" data-profile-tab="data">Dados</button>
        <button class="ui-tab" id="profile-tab-preview" type="button" role="tab" aria-selected="false" aria-controls="profile-panel-preview" tabindex="-1" data-profile-tab="preview">Prévia</button>
      </nav>

      <div class="profile-layout" data-active-panel="data">
        <section class="profile-panel profile-data" id="profile-panel-data" role="tabpanel" aria-labelledby="profile-tab-data" tabindex="0" data-profile-panel="data">
          <section class="profile-section" aria-labelledby="profile-edit-title">
            <h2 id="profile-edit-title">Editar perfil</h2>
            <form class="profile-form" data-profile-form novalidate>
              <div class="form-field">
                <label class="form-field__label" for="profile-nick">Nick</label>
                <div class="form-field__control">
                  <input id="profile-nick" name="nick" type="text" maxlength="20" autocomplete="nickname" data-profile-field="nick" aria-describedby="profile-nick-error" aria-invalid="false" required>
                </div>
                <p class="form-field__error" id="profile-nick-error" data-profile-error="nick" aria-live="polite"></p>
              </div>

              <div class="form-field">
                <label class="form-field__label" for="profile-name">Nome</label>
                <div class="form-field__control">
                  <input id="profile-name" name="name" type="text" autocomplete="name" data-profile-field="name" aria-describedby="profile-name-error">
                </div>
                <p class="form-field__error" id="profile-name-error" data-profile-error="name" aria-live="polite"></p>
              </div>

              <div class="form-field">
                <label class="form-field__label" for="profile-bio">Bio</label>
                <div class="form-field__control profile-bio-control">
                  <textarea id="profile-bio" name="bio" rows="4" data-profile-field="bio" aria-describedby="profile-bio-error"></textarea>
                </div>
                <p class="form-field__error" id="profile-bio-error" data-profile-error="bio" aria-live="polite"></p>
              </div>

              <fieldset class="profile-color-field">
                <legend>Cor de preferência</legend>
                <div class="color-picker" data-profile-colors></div>
                <p class="form-field__error" data-profile-error="color" aria-live="polite"></p>
              </fieldset>

              <p class="profile-form-status" data-profile-status role="status" aria-live="polite"></p>
              <button class="button button-primary-light profile-save" type="submit" disabled>Salvar alterações</button>
            </form>
          </section>

          <section class="profile-section profile-security" aria-labelledby="profile-security-title">
            <h2 id="profile-security-title">Segurança</h2>
            <div class="profile-security-row">
              <div>
                <h3>E-mail</h3>
                <p data-profile-email>Carregando...</p>
              </div>
              <button class="button button-primary-dark" type="button" disabled aria-describedby="profile-email-soon">Alterar e-mail</button>
              <span id="profile-email-soon">Em breve</span>
            </div>
            <div class="profile-security-row">
              <div>
                <h3>Senha</h3>
                <p>Gerencie sua senha de acesso.</p>
              </div>
              <button class="button button-primary-dark" type="button" disabled aria-describedby="profile-password-soon">Alterar senha</button>
              <span id="profile-password-soon">Em breve</span>
            </div>
          </section>
        </section>

        <section class="profile-panel profile-preview-panel" id="profile-panel-preview" role="tabpanel" aria-labelledby="profile-tab-preview" tabindex="0" data-profile-panel="preview">
          <article class="ui-card profile-preview">
            <div class="profile-avatar" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="17" r="8" stroke="currentColor" stroke-width="2"/>
                <path d="M9 42c1.8-8 7.2-12 15-12s13.2 4 15 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
            <h2 data-profile-preview-nick>—</h2>
            <p class="profile-preview-name" data-profile-preview-name></p>
            <p class="profile-preview-bio" data-profile-preview-bio></p>
            <div class="profile-preview-color">
              <span class="color-picker__swatch" data-profile-preview-swatch data-color="blue" aria-hidden="true"></span>
              <span>Cor: <strong data-profile-preview-color>—</strong></span>
            </div>
            <dl class="profile-stats">
              <div><dt>Vitórias</dt><dd data-profile-wins>—</dd></div>
              <div><dt>Derrotas</dt><dd data-profile-losses>—</dd></div>
            </dl>
          </article>
          <nav class="profile-shortcuts" aria-label="Atalhos do perfil">
            <a class="button button-primary-dark" href="./t12-historico.html">Histórico</a>
            <a class="button button-primary-dark" href="./t11-loja.html">Loja</a>
          </nav>
        </section>
      </div>
    </main>
  </body>
</html>
