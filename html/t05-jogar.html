  <head>
    <meta charset="utf-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/screens/rooms.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/screens/rooms.theme.css">
    <link rel="stylesheet" href="../css/screens/online-sala.css">
    <link rel="stylesheet" href="../css/screens/t05-jogar.css">

  </head>
  <body class="rooms-screen">
    <aside class="app-sidebar app-sidebar--global" aria-label="Navegação principal">
      <a class="app-sidebar__brand" href="./t04-home.html" aria-label="LIG-4 Online, início">
        <img class="app-sidebar__logo" src="../assets/images/logo/lig4-mark.svg" alt="">
        <span class="app-sidebar__wordmark">LIG-4</span>
      </a>
      <nav class="app-sidebar__nav" aria-label="Seções principais">
        <a class="app-sidebar__link" href="./t04-home.html">Home</a>
        <a class="app-sidebar__link" href="./t05-jogar.html" aria-current="page">Jogar</a>
        <a class="app-sidebar__link" href="./t11-loja.html">Loja</a>
        <a class="app-sidebar__link" href="./t12-historico.html">Histórico</a>
        <a class="app-sidebar__link" href="./t10-perfil.html">Perfil</a>
      </nav>
      <div class="app-sidebar__footer"><button class="app-sidebar__link" type="button" data-global-logout>Sair</button></div>
    </aside>

    <div class="home-bg" aria-hidden="true">
      <span class="home-bg__disc home-bg__disc--1"></span>
      <span class="home-bg__disc home-bg__disc--2"></span>
      <span class="home-bg__disc home-bg__disc--3"></span>
      <span class="home-bg__disc home-bg__disc--4"></span>
    </div>

    <main class="rooms-main">
      <section class="rooms-content" aria-labelledby="play-title">
        <p class="rooms-kicker">Online</p>
        <h1 id="play-title">Lig - 4 Online</h1>
        <p class="rooms-subtitle">Escolha uma opção para jogar online</p>
        <p class="rooms-warning" data-room-warning role="status" aria-live="polite" hidden></p>
        <nav class="rooms-options" aria-label="Opções de partida">
          <a class="button button-primary-light rooms-option" href="./online.html#criar">
            <span class="rooms-option__copy"><strong>Criar uma sala</strong><small>Crie uma sala para outro jogador entrar</small></span>
            <span class="rooms-option__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>
          <a class="button button-primary-dark rooms-option" href="./online.html#entrar">
            <span class="rooms-option__copy"><strong>Entrar em uma sala</strong><small>Entre em uma sala existente</small></span>
            <span class="rooms-option__arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>
        </nav>
        <a class="button button-secondary rooms-back" href="./t04-home.html">Voltar</a>
      </section>
    </main>

    <script type="module" src="../js/online/aviso-t05.js"></script>
    <script>
      const somClick = new Audio('./audios/click.mp3');
      somClick.preload = 'auto';

      function tocarClick() {
        const s = somClick.cloneNode();
        s.volume = 1;
        return s.play();
      }

      document.addEventListener('click', (evento) => {
        const alvo = evento.target.closest('a[href], button, .button, [role="button"]');
        if (!alvo) return;

        const href = alvo.getAttribute('href');
        const ehNavegacao =
          alvo.tagName === 'A' &&
          href &&
          !href.startsWith('#') &&
          !href.startsWith('javascript:') &&
          alvo.target !== '_blank' &&
          !evento.ctrlKey && !evento.metaKey && !evento.shiftKey;

        if (ehNavegacao) {
          evento.preventDefault();
          let foi = false;
          const ir = () => {
            if (foi) return;
            foi = true;
            window.location.href = alvo.href;
          };
          tocarClick().catch(ir);
          setTimeout(ir, 250);
          return;
        }

        tocarClick().catch(() => {});
      });
    </script>
  </body>
</html>
