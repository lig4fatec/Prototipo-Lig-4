<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18301D">
    <title>Entrar | LIG-4 Online</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/screens/auth.css">
    <script type="module" src="../js/auth-forms.js"></script>
  </head>
  <body class="auth-screen">
    <header class="auth-header">
      <a class="auth-brand" href="./t01-boas-vindas.html" aria-label="LIG-4 Online, página inicial">
        <img src="../assets/images/logo/lig4-mark.svg" alt="">
        <span>LIG-4</span>
      </a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Boas-vindas de volta</h1>
        <p class="auth-intro">Entre para continuar suas partidas.</p>

        <form class="auth-form" data-auth-form="login" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="login-email">E-mail</label>
            <div class="form-field__control">
              <svg class="form-field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input
                id="login-email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                placeholder="voce@exemplo.com"
                data-field="email"
                aria-describedby="login-email-error"
                aria-invalid="false"
                required
              >
            </div>
            <p class="form-field__error" id="login-email-error" data-error-for="email" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="login-password">Senha</label>
            <div class="form-field__control">
              <svg class="form-field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="15.5" r="1.2" fill="currentColor"/>
              </svg>
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Sua senha"
                data-field="password"
                aria-describedby="login-password-help login-password-error"
                aria-invalid="false"
                required
              >
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                aria-label="Mostrar senha"
                aria-controls="login-password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
            <p class="form-field__help" id="login-password-help">Recomendado: use letras maiúsculas e minúsculas, números e símbolos.</p>
            <p class="form-field__error" id="login-password-error" data-error-for="password" aria-live="polite"></p>
          </div>

          <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>
          <button class="button button-primary-light button--full-width" type="submit">Entrar</button>
        </form>

        <p class="auth-footer">Ainda não tem uma conta? <a href="./t03-cadastro.html">Cadastre-se</a></p>
      </section>
    </main>
  </body>
</html>
